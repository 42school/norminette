name: Check I18N Changes

on:
  pull_request:
    branches:
      - master

jobs:
  check-i18n:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (PR branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run I18N module
        run: uv run python -m norminette.i18n

      - name: Check for uncommitted .po changes
        run: |
          if git diff --ignore-matching-lines='^"POT-Creation-Date:' -- '*.po' | grep -P '^[+-](?![+-]{2} [ab]/)' > /dev/null; then
            echo "Meaningful I18N changes detected. Please run 'uv run python -m norminette.i18n' and commit the changes."
            git diff -- '*.po'
            exit 1
          else
              echo "No changes detected in I18N files."
          fi
