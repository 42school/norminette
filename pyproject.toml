[project]
name = "norminette"
version = "3.3.59"
description = "Open source C files linter for 42 Network campuses"
authors = [{ name = "42", email = "pedago@42.fr" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["42", "norminette"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "argparse>=1.4.0",
]

[project.urls]
Repository = "https://github.com/42School/norminette"

[project.scripts]
norminette = "norminette.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.3.2,<8",
    "flake8>=7,<8",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "norminette"
